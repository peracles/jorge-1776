services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./apps/backend/src:/app/src
      - ./apps/backend/data:/app/data
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
    networks:
      - snail-net

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./apps/frontend/src:/app/src
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:3000/api
    depends_on:
      - backend
    networks:
      - snail-net

networks:
  snail-net:
    driver: bridge
